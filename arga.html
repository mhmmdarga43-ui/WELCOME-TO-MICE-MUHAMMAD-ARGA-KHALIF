<!DOCTYPE html>
<html lang="id">
<link rel="stylesheet" href="./style.css">

    <body>
        
    <main class="container">

        <section class="left" aria-labelledby="brand-title">
            <h1>MICE 3C</h1>
            <h2 id="brand-title">WELCOME TO MICE 3C 
                BY MUHAMMAD ARGA KHALIF</h2>
            <p>
                Ayo gabung bersama kami menjadi satu kesatuan mahasiswa dan mari belajar HTML bersama.
            </p>
        </section>

        <section class="right" aria-labelledby="login-title">
            <h2 id="login-title">Sign In</h2>
            <p class="subtitle">Please login to your account</p>

            <form action="#" method="post">
                <button type="button" class="google" aria-label="Sign in with Google">
                    Sign in with Google
                </button>

                <p class="or">or</p>

                <div class="form-group">
                    <label for="email">Email or Username</label>
                    <input
                        type="text"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="username"
                        required>
                </div>

                <div class="form-group">
                    <div class="password-label">
                        <label for="password">Password</label>
                        <a href="#" aria-label="Forgot Password">Forgot Password?</a>
                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required>
                </div>

                <div class="remember">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember Me</label>
                </div>

                <button type="submit" class="login-button">Sign In</button>

                <p class="signup">
                    Don't have an account?
                    <a href="#">Sign Up</a>
                </p>
            </form>
        </section>

    </main>
</body>
</html>
